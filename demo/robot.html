<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot Picks</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; height: 100%; background: #062b3b; color: #e9fcf6; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar { position: fixed; left: 10px; top: 10px; z-index: 3; display: flex; gap: 8px; align-items: center; }
  #bar b { color: #6ff2df; font-size: 15px; text-shadow: 0 1px 3px #000; }
  #bar button { background: rgba(4, 30, 45, .85); color: #e9fcf6; border: 1px solid #2a8a90; border-radius: 9px; padding: 6px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  #bar button.on { background: #ffd23f; color: #3a2a00; border-color: #ffd23f; font-weight: 700; }
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .lab { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; background: rgba(4, 30, 45, .85); border: 1px solid #1d6f78; border-radius: 8px; padding: 3px 8px; }
  .lab b { color: #ffd23f; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="bar"><b>Robot helper</b><button id="spin">Turntable</button></div>
<script type="module" src="robot.js"></script>
</body>
</html>
